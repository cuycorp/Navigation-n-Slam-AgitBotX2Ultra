# Q2.1: route driven by auto_map (route D.1), in world coordinates (metres), taken from the House floor plan.
# Chosen on 2026-11-12 after comparing 6 routes: the most accurate map (P-013).
# Run it with pass_through:=true and angular_accel:=1.5 (make auto-map does): the robot drives through
# the rounded corners (arcs of short steps, radius 0.45 m) without stopping, and ramps up its turns.
# [x, y, s] = stop there for s seconds, so slam_toolbox gets steady scans.
# Narrow rooms (north, southwest) are only driven straight in and out: loops in corridor-like rooms gave bad matches.
